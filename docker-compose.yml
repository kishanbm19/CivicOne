services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in backend/.env}
      OPENAI_API_KEY: ${LOAD_TEST_OPENAI_API_KEY:-}
      UPLOAD_DIRECTORY: /app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_storage:/app/storage
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_storage:
