version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: civicone_db
    environment:
      POSTGRES_USER: civic_user
      POSTGRES_PASSWORD: civic_secret_pass
      POSTGRES_DB: civicone_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic_user -d civicone_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicone_backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://civic_user:civic_secret_pass@db:5432/civicone_db
      JWT_SECRET_KEY: civicone-production-grade-hmac-sha256-key-32chars
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UPLOAD_DIRECTORY: /app/storage
      MAX_UPLOAD_SIZE_MB: 5
    volumes:
      - backend_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicone_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
